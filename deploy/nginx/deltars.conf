# deltars.com.br -> container delta_web:5000 (rede shared_net)
# Faixa de sites de clientes: 5000+.
# A nuvem laranja da Cloudflare fala com a origem em HTTP ou HTTPS.
# A porta 80 continua servindo o site (sem redirect) para o modo Flexible não entrar em loop.

server {
    listen 80;
    listen [::]:80;
    server_name deltars.com.br www.deltars.com.br;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        set $delta_upstream "delta_web:5000";
        proxy_pass http://$delta_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name deltars.com.br www.deltars.com.br;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/deltars.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deltars.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        set $delta_upstream "delta_web:5000";
        proxy_pass http://$delta_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }
}
